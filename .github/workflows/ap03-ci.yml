name: AP-02 / AP-03 · Apartment checks
on:
  push:
    branches:
      - feat/ap03-blender-glb-bridge
  pull_request:
    branches:
      - feat/ap02-apartment-foundation
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert upstream vendor unchanged
        run: test "$(git rev-parse HEAD:vendor/matterport-dl)" = "b53c7074f7d5ba652449480806bff5dcc9696e69"
      - name: Check Blender 5.2 source compatibility
        shell: bash
        run: |
          python3 -W error -m py_compile tools/blender/ap03_create_room.py
          python3 - <<'PY'
          from pathlib import Path
          script = Path("tools/blender/ap03_create_room.py").read_text(encoding="utf-8")
          assert "bpy.context.scene.view_settings.view_transform" in script, "View settings must be accessed through scene"
          assert "bpy.context.view_settings." not in script, "Invalid Blender context property"
          assert ".use_nodes =" not in script, "Deprecated material property"
          assert "AP03_OK GLB:" in script, "Missing success marker"
          print("Blender source checks passed (runtime export still requires Blender).")
          PY
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
